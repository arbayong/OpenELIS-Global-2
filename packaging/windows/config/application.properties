# AegisDiagnostics OpenELIS — deployment config template
# Copied to <install>\config\ on first install; edit per site.

# Datasource (local PostgreSQL service installed by the setup)
spring.datasource.url=jdbc:postgresql://localhost:5432/openelis
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / Liquibase
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:liquibase/base-changelog.xml

# Gateway master key for encrypting stored payment-gateway secrets (AES, base64).
# Generate with: openssl rand -base64 32   — set as JVM arg: -Daegis.gateway.masterKey=<value>
# aegis.gateway.masterKey=

# Server
server.port=8080
server.servlet.context-path=/openelis

# Aegis data directory (NHIS exports, uploads)
aegis.data.dir=C:\Program Files\AegisDiagnostics\OpenELIS\data
