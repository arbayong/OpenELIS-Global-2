# OpenELIS Billing — deployment config template
# Copied to <install>\config\ on first install; edit per site.

# Datasource (local PostgreSQL service installed by the setup)
spring.datasource.url=jdbc:postgresql://localhost:5432/openelis
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / Liquibase
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:liquibase/base-changelog.xml

# Gateway master key for encrypting stored payment-gateway secrets (AES-GCM, base64).
# A generated default ships here so secrets are never stored as plaintext.
# ROTATE THIS PER DEPLOYMENT (openssl rand -base64 32) and pass it as a JVM arg:
#   -Dopenelis.billing.gateway.masterKey=<value>
openelis.billing.gateway.masterKey=bSjoHPRRAQLIPsK8stYWa2dGJKASPvR+QAp23SRUPio=

# Server
server.port=8080
server.servlet.context-path=/openelis

# Data directory (NHIS exports, uploads)
openelis.billing.data.dir=C:\Program Files\OpenELIS\Billing\data
